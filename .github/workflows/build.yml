name: build

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow never writes to the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to a full commit SHA, never a moving tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build, sign and verify
        run: make verify SIGN_ID=-
